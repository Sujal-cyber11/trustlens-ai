<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TrustLens AI Popup</title>
  <style>
    body {
      width: 350px;
      margin: 0;
      padding: 14px;
      background: #0b1120;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 12.5px;
    }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .brand { font-size: 15px; font-weight: 800; color: #14b8a6; }
    .lang-btn {
      background: #1e293b; color: #cbd5e1; border: 1px solid #334155;
      padding: 4px 8px; border-radius: 6px; font-size: 11px; cursor: pointer;
    }
    .verdict-box {
      background: #1e293b; border: 2px solid #334155; border-radius: 10px;
      padding: 10px 12px; margin-bottom: 10px;
    }
    .verdict-title { font-size: 14px; font-weight: 800; margin-bottom: 4px; }
    .subscores { font-size: 11px; color: #94a3b8; margin-bottom: 6px; }
    .calm-msg { font-size: 12px; color: #38bdf8; font-weight: 600; }
    .ind-list {
      background: #111827; border: 1px solid #1e293b; border-radius: 8px;
      padding: 8px 10px; margin-bottom: 10px; max-height: 140px; overflow-y: auto;
    }
    .ind-item { margin-bottom: 6px; font-size: 11.5px; border-bottom: 1px solid #1e293b; padding-bottom: 4px; }
    .ind-item:last-child { margin-bottom: 0; border-bottom: none; }
    .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    button.act-btn {
      background: #1e293b; color: #e2e8f0; border: 1px solid #334155;
      border-radius: 7px; padding: 7px 8px; font-size: 11.5px; font-weight: 700; cursor: pointer;
    }
    button.act-btn:hover { background: #334155; }
    button.btn-danger { background: #991b1b; border-color: #ef4444; color: #fff; }
    .footer-links { display: flex; justify-content: space-between; margin-top: 10px; font-size: 11px; color: #64748b; }
    .footer-links a { color: #38bdf8; text-decoration: none; cursor: pointer; }
  </style>
</head>
<body>
  <div class="top-bar">
    <span class="brand">🛡️ TrustLens AI</span>
    <button id="langToggleBtn" class="lang-btn">🌐 EN / हिं</button>
  </div>

  <div id="verdictCard" class="verdict-box">
    <div id="verdictTitle" class="verdict-title">Checking current page...</div>
    <div id="subScoreLine" class="subscores">Malicious: --/100 | Dark Patterns: --/100</div>
    <div id="calmLine" class="calm-msg"></div>
  </div>

  <div class="ind-list" id="indicatorsContainer">
    <div style="color:#64748b;">Top indicators will appear here.</div>
  </div>

  <div class="btn-grid">
    <button id="pauseSiteBtn" class="act-btn">⏸️ Pause on This Site</button>
    <button id="pauseGlobalBtn" class="act-btn">⏸️ Pause Everywhere</button>
    <button id="markSafeBtn" class="act-btn">✅ Mark Page Safe</button>
    <button id="reportBtn" class="act-btn btn-danger">🚨 Report Scam Page</button>
  </div>

  <div class="footer-links">
    <a id="openOptionsLink">⚙️ Extension Options</a>
    <a id="openDashboardLink">📊 Open Local Dashboard</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
