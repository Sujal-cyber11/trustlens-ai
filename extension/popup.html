<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TrustLens AI Popup</title>
  <style>
    body {
      width: 370px;
      margin: 0;
      padding: 14px;
      background: #0b1120;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.45;
    }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .brand { font-size: 16px; font-weight: 800; color: #14b8a6; }
    .lang-btn {
      background: #1e293b; color: #f8fafc; border: 1px solid #334155;
      padding: 5px 10px; border-radius: 6px; font-size: 12.5px; font-weight: 700; cursor: pointer;
    }
    .verdict-box {
      background: #1e293b; border: 2px solid #334155; border-radius: 10px;
      padding: 10px 12px; margin-bottom: 10px;
    }
    .verdict-title { font-size: 17px; font-weight: 800; margin-bottom: 4px; }
    .calm-msg { font-size: 14px; color: #7dd3fc; font-weight: 700; margin-bottom: 6px; }
    .three-lines { font-size: 14px; background: #111827; padding: 8px 10px; border-radius: 8px; margin-bottom: 8px; }
    .pie-wrap {
      background: #111827; border: 1px solid #1e293b; border-radius: 8px;
      padding: 8px 10px; margin-bottom: 10px;
    }
    .pie-row { display: flex; align-items: center; gap: 10px; }
    .legend-col { display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
    .legend-item { display: flex; align-items: center; gap: 6px; font-weight: 600; }
    .swatch { width: 11px; height: 11px; border-radius: 2px; display: inline-block; flex-shrink: 0; }
    .sr-table { width: 100%; border-collapse: collapse; margin-top: 6px; font-size: 12.5px; }
    .sr-table td { border: 1px solid #334155; padding: 3px 6px; }
    .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    button.act-btn {
      background: #1e293b; color: #f8fafc; border: 1px solid #334155;
      border-radius: 7px; padding: 8px; font-size: 13px; font-weight: 700; cursor: pointer;
    }
    button.act-btn:hover { background: #334155; }
    button.btn-danger { background: #991b1b; border-color: #ef4444; color: #fff; }
    .footer-links { display: flex; justify-content: space-between; margin-top: 10px; font-size: 12.5px; }
    .footer-links a { color: #38bdf8; text-decoration: none; cursor: pointer; font-weight: 600; }
  </style>
</head>
<body>
  <div class="top-bar">
    <span class="brand">🛡️ TrustLens Helper</span>
    <button id="langToggleBtn" class="lang-btn">🌐 EN / हिं</button>
  </div>

  <div id="verdictCard" class="verdict-box">
    <div id="verdictTitle" class="verdict-title">Checking current page...</div>
    <div id="calmLine" class="calm-msg"></div>
    <div id="threeLinesBox" class="three-lines"></div>
  </div>

  <div id="pieSection" class="pie-wrap" style="display:none;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
      <strong id="pieHeading" style="font-size:13.5px;">🥧 Why is this risky?</strong>
      <button id="showListBtn" class="lang-btn" style="padding:2px 7px; font-size:11.5px;">Show as list</button>
    </div>
    <div class="pie-row">
      <div id="svgMount"></div>
      <div id="legendMount" class="legend-col"></div>
    </div>
    <table id="listTable" class="sr-table" style="display:none;"></table>
  </div>

  <div class="btn-grid">
    <button id="pauseSiteBtn" class="act-btn">⏸️ Pause on This Site</button>
    <button id="pauseGlobalBtn" class="act-btn">⏸️ Pause Everywhere</button>
    <button id="markSafeBtn" class="act-btn">✅ This is safe</button>
    <button id="reportBtn" class="act-btn btn-danger">🚨 Report Scam</button>
  </div>

  <div class="footer-links">
    <a id="openOptionsLink">⚙️ Settings</a>
    <a id="openDashboardLink">📊 Open Dashboard</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
